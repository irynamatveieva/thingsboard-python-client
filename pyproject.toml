[tool.poetry]
name = "thingsboard-python-client"
version = "4.3.1.2"
description = "Monorepo root — version source for all ThingsBoard Python client editions"
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-mock = "^3.14"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "ce/tb_ce_client",
    "pe/tb_pe_client",
    "paas/tb_paas_client",
    "*/target",
    "dist",
    ".venv",
    ".idea",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests insert paths into sys.path before importing local packages, and contain
# long explanatory comments inline with assertions; both are intentional.
"tests/**" = ["E402", "E501"]
